<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Score - PlayPal Admin</title>
    <link rel="stylesheet" href="../styles/main.css">
    <link rel="stylesheet" href="../styles/layout.css">
    <link rel="stylesheet" href="../styles/dashboard.css">
    <style>
        .muted { color: var(--color-text-secondary); font-size: 0.88rem; }
        .card-section { margin-bottom: 1.25rem; }
        .overall-score {
            display: flex;
            flex-wrap: wrap;
            align-items: baseline;
            gap: 0.75rem 1.25rem;
            margin-bottom: 1rem;
        }
        .overall-score .big {
            font-size: 2.6rem;
            font-weight: 800;
            color: var(--color-text);
            line-height: 1;
        }
        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 0.75rem;
            margin-bottom: 1rem;
        }
        .kpi-tile {
            background: var(--color-surface);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-md);
            padding: 0.85rem;
        }
        .kpi-tile .label { font-size: 0.75rem; color: var(--color-text-secondary); text-transform: uppercase; letter-spacing: 0.04em; }
        .kpi-tile .value { font-size: 1.35rem; font-weight: 700; color: var(--color-text); margin-top: 0.25rem; }
        .kpi-tile .contrib { font-size: 0.85rem; color: var(--color-text-secondary); margin-top: 0.35rem; }
        .kpi-tile .weight { font-size: 0.75rem; color: var(--color-text-secondary); margin-top: 0.15rem; }
        .toolbar-row { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; margin-bottom: 0.75rem; }
        .chart-wrap { position: relative; height: 280px; margin: 0.75rem 0 1rem; }
        .timeline-table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
        .timeline-table th, .timeline-table td { border: 1px solid var(--color-border); padding: 0.4rem 0.5rem; text-align: left; }
        .timeline-table th { background: var(--color-surface); }
        .formula-box {
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            font-size: 0.78rem;
            background: var(--color-surface);
            border: 1px solid var(--color-border);
            border-radius: 8px;
            padding: 0.75rem 1rem;
            white-space: pre-wrap;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Score</h1>
        <div class="header-actions">
            <span id="admin-name"></span>
            <button class="btn btn-secondary" onclick="logout()">Logout</button>
        </div>
    </div>

    <div class="container">
        <div id="error-message" class="error" style="display: none;"></div>
        <p class="muted" style="margin-bottom: 1rem;">
            Overall score = sum of each parameter contribution. Weights live in
            <code>js/score.js</code> (<code>SCORE_WEIGHTS</code>) so you can tweak them without a backend change.
        </p>

        <div class="card card-section">
            <div class="card-header">
                <h2 class="card-title">Today (UTC)</h2>
                <div class="toolbar-row" style="margin:0;">
                    <button class="btn btn-secondary" type="button" onclick="recordScoreSnapshot()">Record snapshot</button>
                    <button class="btn btn-primary" type="button" onclick="loadScoreLive()">Refresh</button>
                </div>
            </div>
            <div class="overall-score">
                <div class="big" id="overall-score-value">—</div>
                <div class="muted" id="overall-score-note">Loading…</div>
            </div>
            <div id="score-param-kpis" class="kpi-grid">Loading…</div>
            <div class="formula-box" id="score-formula-box"></div>
        </div>

        <div class="card card-section">
            <div class="card-header">
                <h2 class="card-title">Score over time</h2>
                <button class="btn btn-primary" type="button" onclick="loadScoreHistory()">Load</button>
            </div>
            <div class="toolbar-row">
                <label>From <input type="date" id="score-from" class="form-input" style="width: auto;"></label>
                <label>To <input type="date" id="score-to" class="form-input" style="width: auto;"></label>
            </div>
            <div class="chart-wrap">
                <canvas id="score-chart"></canvas>
            </div>
            <div id="score-history-wrap" class="table-wrap" style="overflow:auto; max-height: 420px;"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
    <script src="../js/config.js"></script>
    <script src="../js/dbTarget.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/app.js"></script>
    <script src="../js/adminShell.js"></script>
    <script src="../js/score.js"></script>
    <script>
        if (!isAuthenticated()) {
            navigate('/login');
        } else {
            const admin = getCurrentAdmin();
            if (admin) {
                document.getElementById('admin-name').textContent = admin.name || admin.email || 'Admin';
            }
            initScorePage();
        }
    </script>
</body>
</html>
