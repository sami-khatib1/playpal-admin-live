<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Searches - PlayPal Admin</title>
    <link rel="stylesheet" href="../styles/main.css">
    <link rel="stylesheet" href="../styles/layout.css">
    <link rel="stylesheet" href="../styles/dashboard.css">
    <style>
        .filters {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 0.75rem;
            margin-bottom: 1rem;
        }
        .filters .field { display: flex; flex-direction: column; gap: 0.3rem; }
        .filters .form-label { margin: 0; }
        .filters input[type="date"] {
            width: 100%;
            min-height: var(--touch-min);
            padding: 0.65rem 0.85rem;
            border: 1px solid var(--color-border);
            border-radius: var(--radius-sm);
            background: var(--color-input-bg);
            color: var(--color-text);
            font-size: 16px;
        }
        .summary {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 0.6rem;
            margin-bottom: 0.9rem;
        }
        .summary-card {
            text-align: left;
            border: 1px solid var(--color-border);
            background: var(--color-surface);
            border-radius: var(--radius-sm);
            padding: 0.7rem 0.8rem;
            cursor: pointer;
        }
        .summary-card.is-active {
            border-color: var(--color-primary, #111);
            box-shadow: inset 0 0 0 1px var(--color-primary, #111);
        }
        .summary-card .count {
            display: block;
            font-size: 1.35rem;
            font-weight: 700;
            line-height: 1.1;
        }
        .summary-card .label {
            color: var(--color-text-secondary);
            font-size: 0.82rem;
        }
        .chip-row {
            display: flex;
            flex-wrap: wrap;
            gap: 0.4rem;
            margin-bottom: 0.75rem;
        }
        .chip {
            border: 1px solid var(--color-border);
            background: var(--color-surface);
            color: var(--color-text);
            border-radius: 999px;
            padding: 0.3rem 0.7rem;
            font-size: 0.8rem;
            cursor: pointer;
        }
        .chip strong { font-weight: 700; }
        .table-wrap { overflow: auto; max-height: 70vh; }
        .filters-cell {
            max-width: 360px;
            white-space: pre-wrap;
            word-break: break-word;
        }
        .pill {
            display: inline-block;
            padding: 0.2rem 0.55rem;
            border-radius: 999px;
            font-size: 0.75rem;
            font-weight: 600;
            border: 1px solid var(--color-border);
            background: var(--color-surface);
        }
        .toolbar {
            display: flex;
            gap: 0.5rem;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 0.5rem;
            flex-wrap: wrap;
        }
        .muted { color: var(--color-text-secondary); font-size: 0.9rem; }
        .actions-inline { display: flex; gap: 0.5rem; align-items: center; }
        .query-empty { color: var(--color-text-secondary); font-style: italic; }
    </style>
</head>
<body>
    <div class="header">
        <h1>Searches</h1>
        <div class="header-actions">
            <span id="admin-name"></span>
            <button class="btn btn-secondary" onclick="logout()">Logout</button>
        </div>
    </div>

    <div class="container">
        <div id="error-message" class="error" style="display: none;"></div>

        <div class="card">
            <div class="card-header">
                <h2 class="card-title">Explore searches</h2>
                <button class="btn btn-primary" onclick="loadSearches()">Refresh</button>
            </div>

            <div class="summary" id="summary"></div>
            <div class="chip-row" id="top-queries"></div>
            <div class="chip-row" id="top-sports"></div>

            <div class="filters">
                <div class="field">
                    <label class="form-label" for="filter-type">Type</label>
                    <select id="filter-type" class="form-input">
                        <option value="all">All</option>
                        <option value="activity">Activities</option>
                        <option value="group">Groups</option>
                        <option value="user">People</option>
                    </select>
                </div>
                <div class="field">
                    <label class="form-label" for="filter-sport">Sport</label>
                    <select id="filter-sport" class="form-input">
                        <option value="all">All sports</option>
                    </select>
                </div>
                <div class="field">
                    <label class="form-label" for="filter-gender">Gender</label>
                    <select id="filter-gender" class="form-input">
                        <option value="all">All</option>
                        <option value="female">Female</option>
                        <option value="male">Male</option>
                        <option value="mixed">Mixed</option>
                    </select>
                </div>
                <div class="field">
                    <label class="form-label" for="filter-kind">What they did</label>
                    <select id="filter-kind" class="form-input">
                        <option value="any">Search or filters</option>
                        <option value="query">Typed a search</option>
                        <option value="filters">Filters only</option>
                    </select>
                </div>
                <div class="field">
                    <label class="form-label" for="filter-from">From</label>
                    <input id="filter-from" class="form-input" type="date" />
                </div>
                <div class="field">
                    <label class="form-label" for="filter-to">To</label>
                    <input id="filter-to" class="form-input" type="date" />
                </div>
                <div class="field">
                    <label class="form-label" for="filter-q">Query</label>
                    <input id="filter-q" class="form-input" type="search" placeholder="padel, haifa…" />
                </div>
                <div class="field">
                    <label class="form-label" for="filter-user">User</label>
                    <input id="filter-user" class="form-input" type="search" placeholder="Name or username" />
                </div>
            </div>

            <div class="toolbar">
                <div id="meta" class="muted">Loading…</div>
                <div class="actions-inline">
                    <button class="btn btn-secondary" type="button" onclick="clearSearchFilters()">Clear</button>
                    <button class="btn btn-secondary" type="button" onclick="prevPage()">Prev</button>
                    <span id="page-info" class="muted">Page 1</span>
                    <button class="btn btn-secondary" type="button" onclick="nextPage()">Next</button>
                </div>
            </div>

            <div id="loading" class="loading">Loading searches...</div>
            <div id="table-wrap" class="table-wrap" style="display:none;">
                <table class="table">
                    <thead>
                        <tr>
                            <th>When</th>
                            <th>Type</th>
                            <th>Query</th>
                            <th>Sport</th>
                            <th>User</th>
                            <th>Filters</th>
                        </tr>
                    </thead>
                    <tbody id="search-table-body"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="../js/config.js"></script>
    <script src="../js/dbTarget.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/app.js"></script>
    <script src="../js/adminShell.js"></script>
    <script src="../js/sportLabels.js"></script>
    <script src="../js/searches.js"></script>
    <script>
        if (!isAuthenticated()) {
            navigate('/login');
        } else {
            const admin = getCurrentAdmin();
            if (admin) {
                document.getElementById('admin-name').textContent = admin.name || admin.email || 'Admin';
            }
            initSearchesPage();
        }
    </script>
</body>
</html>
